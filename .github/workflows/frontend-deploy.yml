name: LMS Frontend → Netlify
on:
  push:
    branches: [main]
    paths: ['frontend/**']
  workflow_dispatch:
concurrency:
  group: lms-frontend-deploy
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://${{ vars.API_DOMAIN }}
          VITE_KEYCLOAK_URL: https://${{ vars.AUTH_DOMAIN }}
          VITE_KEYCLOAK_REALM: lms
          VITE_KEYCLOAK_CLIENT_ID: lms-web
      - name: Deploy (netlify-cli pinned via devDependencies)
        run: npx netlify deploy --prod --dir=dist