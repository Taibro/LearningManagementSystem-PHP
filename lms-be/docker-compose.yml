services:
  lms_db:
    image: postgres:16-alpine
    container_name: lms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "0.0.0.0:5432:5432"
    volumes: [lms_pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 1g
    networks: [lms_net]

  lms_backend:
    image: ghcr.io/${GHCR_OWNER}/lms-backend:${IMAGE_TAG:-latest}
    container_name: lms_backend
    restart: unless-stopped
    env_file: [.env]
    depends_on:
      lms_db: { condition: service_healthy }
    volumes: [lms_storage:/var/www/html/storage/app]
    mem_limit: 512m
    networks: [lms_net]

  lms_web:
    image: nginx:alpine
    container_name: lms_web
    restart: unless-stopped
    ports: ["127.0.0.1:8081:80"]
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      lms_backend: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/up || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    mem_limit: 128m
    networks: [lms_net]

volumes:
  lms_pg_data:
  lms_storage:
networks:
  lms_net: