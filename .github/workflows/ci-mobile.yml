name: CI - Mobile (LMS React Native)

on:
  push:
    branches: [main, develop]
    paths:
      - 'lms-native/**'
      - '.github/workflows/ci-mobile.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lms-native/**'

concurrency:
  group: ci-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============ LINT + TEST ============
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lms-native
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lms-native/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Run Jest tests
        run: npm test -- --watchAll=false --passWithNoTests