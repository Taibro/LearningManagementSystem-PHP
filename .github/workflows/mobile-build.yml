name: LMS Mobile (React Native) → APK artifact
on:
  push:
    branches: [main]
    paths:
      - 'lms-native/**'
      - '.github/workflows/mobile-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: lms-native
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lms-native/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Create .env for Expo / React Native build
        run: |
          cat <<EOF > .env
          EXPO_PUBLIC_API_BASE_URL=https://${{ vars.API_DOMAIN }}
          EXPO_PUBLIC_KEYCLOAK_URL=https://${{ vars.AUTH_DOMAIN }}
          EXPO_PUBLIC_KEYCLOAK_REALM=lms
          EXPO_PUBLIC_KEYCLOAK_CLIENT_ID=lms-mobile
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          EOF

      - name: Prebuild Android native project (if not present)
        env:
          CI: "1"
        run: |
          if [ ! -d "android" ]; then
            npx expo prebuild --platform android --no-install
          fi

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lms-mobile-apk
          path: lms-native/android/app/build/outputs/apk/release/*.apk
          retention-days: 14
