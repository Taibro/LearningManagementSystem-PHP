name: LMS Mobile (React Native) → APK artifact

on:
  push:
    branches: [main]
    paths:
      - 'lms-native/**'
      - '.github/workflows/mobile-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lms-mobile-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: lms-native
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lms-native/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Create .env for React Native build
        run: |
          {
            echo "EXPO_PUBLIC_API_BASE_URL=https://${{ vars.API_DOMAIN }}"
            echo "EXPO_PUBLIC_KEYCLOAK_URL=https://${{ vars.AUTH_DOMAIN }}"
            echo "EXPO_PUBLIC_KEYCLOAK_REALM=lms"
            echo "EXPO_PUBLIC_KEYCLOAK_CLIENT_ID=lms-mobile"
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}"
          } > .env

      - name: Prebuild Android native project (if not present)
        env:
          CI: "1"
        run: |
          if [ ! -d "android" ]; then
            npx expo prebuild --platform android --no-install
          fi

      - name: Create CI keystore
        run: |
          keytool -genkeypair -v -keystore android/app/ci-release.keystore \
            -alias ci-release -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass cicicici -keypass cicicici \
            -dname "CN=CI, OU=CI, O=CI, L=CI, S=CI, C=VN"

      - name: Sign release with CI keystore
        run: |
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file("ci-release.keystore")
                      storePassword "cicicici"
                      keyAlias "ci-release"
                      keyPassword "cicicici"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lms-mobile-apk
          path: lms-native/android/app/build/outputs/apk/release/*.apk
          retention-days: 14