name: CI - Frontend (LMS)

on:
  push:
    branches: [main, develop]
    paths:
      - 'lms-fe/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lms-fe/**'

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lms-fe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lms-fe/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build production
        run: npm run build
        env:
          VITE_API_BASE_URL: https://lms-dev-api.duckdns.org
          VITE_KEYCLOAK_URL: https://auth-dev-api.duckdns.org
          VITE_KEYCLOAK_REALM: lms
          VITE_KEYCLOAK_CLIENT_ID: lms-web

      - name: Add SPA fallback rule (cho Cloudflare Pages)
        run: echo "/* /index.html 200" > dist/_redirects